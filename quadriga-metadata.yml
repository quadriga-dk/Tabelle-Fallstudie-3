description: In dieser Open Educational Resource wird mit der Applikation R Shiny
  ein Dashboard gebaut, das das Engagement der Bürger:innen in Bezug auf die Bewässerung
  städtischer Bäumen visualisiert. Dabei werden Kompetenzen im Bereich Visualisierung
  und Kommunikation von Daten vermittelt.
